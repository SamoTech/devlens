name: DevLens Self Health

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  security-events: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  self-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DevLens
        uses: actions/checkout@v4.2.2

      - name: Score DevLens itself
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          badge_style: flat-square
          update_readme: 'true'
          fail_on_score_below: '100'

      - name: Publish self-health summary
        if: always()
        run: |
          echo "## DevLens Self-Health" >> "$GITHUB_STEP_SUMMARY"
          echo "The repository scores itself on every main-branch code change and weekly." >> "$GITHUB_STEP_SUMMARY"
          echo "Target: **100/100**. README updates are ignored by this workflow to prevent recursive runs." >> "$GITHUB_STEP_SUMMARY"
