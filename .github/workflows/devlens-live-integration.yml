name: DevLens Live Integration

on:
  push:
    branches: [main]
    paths:
      - 'action.yml'
      - 'scripts/**'
      - '.github/workflows/devlens-live-integration.yml'
  pull_request:
    branches: [main]
    paths:
      - 'action.yml'
      - 'scripts/**'
      - '.github/workflows/devlens-live-integration.yml'
  workflow_dispatch:

permissions:
  contents: write
  security-events: read

jobs:
  live-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DevLens
        uses: actions/checkout@v4.2.2

      - name: Run the real Action against a real GitHub repository
        id: devlens
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          update_readme: 'false'

      - name: Validate live Action outputs
        env:
          SCORE: ${{ steps.devlens.outputs.health_score }}
          REPORT: ${{ steps.devlens.outputs.report_json }}
          BADGE: ${{ steps.devlens.outputs.badge_url }}
        shell: python
        run: |
          import json
          import os

          score = int(os.environ["SCORE"])
          assert 0 <= score <= 100, score

          report = json.loads(os.environ["REPORT"])
          expected = {
              "repo",
              "score_model",
              "health_score",
              "scores",
              "badge_url",
              "generated_at",
          }
          assert expected <= report.keys(), report.keys()
          assert report["score_model"] == "action-v2-9d"
          assert report["health_score"] == score

          dimensions = {
              "readme", "activity", "freshness", "docs", "ci",
              "issues", "community", "pr_velocity", "security",
          }
          assert set(report["scores"]) == dimensions
          assert all(0 <= int(v) <= 100 for v in report["scores"].values())
          assert os.environ["BADGE"].startswith("https://img.shields.io/badge/")
          assert report["action_version"] == "2.0.8"

          print(f"Live DevLens integration passed: {score}/100")

  readme-persistence:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DevLens
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Create disposable test branch
        id: test_branch
        shell: bash
        run: |
          set -euo pipefail
          branch="devlens-integration-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git push origin "HEAD:$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Run real Action with README persistence enabled
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          update_readme: 'true'
          readme_branch: ${{ steps.test_branch.outputs.branch }}

      - name: Verify README was written through GitHub API
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ steps.test_branch.outputs.branch }}"
          git show "origin/${{ steps.test_branch.outputs.branch }}:README.md" | grep -F '<!-- DEVLENS:START -->'
          git show "origin/${{ steps.test_branch.outputs.branch }}:README.md" | grep -F '<!-- DEVLENS:END -->'
          echo 'README persistence integration passed.'

      - name: Delete disposable test branch
        if: always()
        shell: bash
        run: git push origin --delete "${{ steps.test_branch.outputs.branch }}" || true
