name: Create Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to create (e.g. v2.0.3)'
        required: true
        default: 'v2.0.3'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: devlens-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine whether this change requires a release
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
            SHOULD_RELEASE=true
          else
            mapfile -t CHANGED_FILES < <(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")

            CRITICAL=false
            for file in "${CHANGED_FILES[@]}"; do
              case "$file" in
                action.yml|scripts/devlens.py|requirements.txt|.github/workflows/release.yml|.github/workflows/action-v2-validation.yml|.github/workflows/devlens-live-integration.yml)
                  CRITICAL=true
                  echo "Critical release path changed: $file"
                  ;;
              esac
            done

            if [[ "$CRITICAL" != "true" ]]; then
              echo "No critical production change detected. No release required."
              SHOULD_RELEASE=false
              TAG=""
            else
              SHOULD_RELEASE=true
              LATEST="$(git tag -l 'v2.[0-9]*.[0-9]*' | sort -V | tail -n 1)"
              if [[ -z "$LATEST" ]]; then
                TAG="v2.0.0"
              else
                IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
                PATCH=$((PATCH + 1))
                TAG="v${MAJOR}.${MINOR}.${PATCH}"
              fi
              echo "Automatic critical-change release: $TAG"
            fi
          fi

          if [[ "$SHOULD_RELEASE" == "true" && ! "$TAG" =~ ^v2\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match v2.x.x: $TAG"
            exit 1
          fi

          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create or reuse versioned release tag
        if: steps.release.outputs.should_release == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch --tags --force origin
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Release tag already exists and will be reused: $RELEASE_TAG"
          else
            git tag -a "$RELEASE_TAG" HEAD -m "Release $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
            echo "Created release tag: $RELEASE_TAG"
          fi

      - name: Checkout release tag
        if: steps.release.outputs.should_release == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          git checkout --detach "$RELEASE_TAG"

      - name: Pre-release static validation
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/devlens.py
          test -f action.yml
          test -f requirements.txt
          grep -Fx 'requests==2.34.2' requirements.txt
          grep -Fx 'PyGithub==2.10.0' requirements.txt

      - name: Pre-release live Action validation
        if: steps.release.outputs.should_release == 'true'
        id: preflight
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          update_readme: 'false'

      - name: Validate live release candidate
        if: steps.release.outputs.should_release == 'true'
        env:
          SCORE: ${{ steps.preflight.outputs.health_score }}
          REPORT: ${{ steps.preflight.outputs.report_json }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: python
        run: |
          import json
          import os
          import re

          score = int(os.environ["SCORE"])
          assert 0 <= score <= 100

          report = json.loads(os.environ["REPORT"])
          assert report["score_model"] == "action-v2-9d"

          action_version = str(report["action_version"])
          assert re.fullmatch(r"2\.[0-9]+\.[0-9]+", action_version), action_version

          release_version = os.environ["RELEASE_TAG"][1:]
          assert action_version == release_version, (
              f"Action version {action_version} does not match release {release_version}"
          )

          assert set(report["scores"]) == {
              "readme", "activity", "freshness", "docs", "ci",
              "issues", "community", "pr_velocity", "security",
          }

          print(f"Release preflight passed: {score}/100; action version {action_version}")

      - name: Update floating v2 tag
        if: steps.release.outputs.should_release == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch --tags --force origin
          git checkout --detach "$RELEASE_TAG"
          git tag -fa v2 -m "Floating tag v2 -> $RELEASE_TAG"
          git push origin v2 --force

      - name: Publish GitHub Release
        if: steps.release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: "DevLens ${{ steps.release.outputs.tag }}"
          body: |
            ## DevLens ${{ steps.release.outputs.tag }}

            ### What's included
            - Repository health scoring across 9 dimensions
            - Automatic README score block updates
            - GitHub Actions job summary and machine-readable outputs
            - Live GitHub API integration testing
            - Zero hosted service dependency

            ### Usage
            \`\`\`yaml
            - uses: SamoTech/devlens@v2
            \`\`\`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
