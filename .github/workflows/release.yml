name: Create Release

on:
  push:
    branches:
      - main
    tags:
      - 'v2.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to create (e.g. v2.0.2)'
        required: true
        default: 'v2.0.2'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bootstrap-floating-tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create v2 for the existing V2.0.0 release
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          if git ls-remote --exit-code --tags origin refs/tags/v2 >/dev/null 2>&1; then
            echo "Floating tag v2 already exists."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TARGET="$(git rev-parse 'V2.0.0^{}')"
          git tag -a v2 "$TARGET" -m "Floating tag v2 -> V2.0.0"
          git push origin v2

  prepare-release-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate requested release tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v2\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match v2.x.x: $RELEASE_TAG"
            exit 1
          fi

      - name: Create versioned release tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch --tags --force origin
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Release tag already exists: $RELEASE_TAG"
            exit 1
          fi

          git tag -a "$RELEASE_TAG" HEAD -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v2\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match v2.x.x: $RELEASE_TAG"
            exit 1
          fi

      - name: Pre-release static validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/devlens.py
          test -f action.yml
          test -f requirements.txt
          grep -Fx 'requests==2.34.2' requirements.txt
          grep -Fx 'PyGithub==2.10.0' requirements.txt

      - name: Pre-release live Action validation
        id: preflight
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          update_readme: 'false'

      - name: Validate live release candidate
        env:
          SCORE: ${{ steps.preflight.outputs.health_score }}
          REPORT: ${{ steps.preflight.outputs.report_json }}
        shell: python
        run: |
          import json
          import os
          import re

          score = int(os.environ["SCORE"])
          assert 0 <= score <= 100

          report = json.loads(os.environ["REPORT"])
          assert report["score_model"] == "action-v2-9d"

          action_version = str(report["action_version"])
          assert re.fullmatch(r"2\.[0-9]+\.[0-9]+", action_version), action_version

          assert set(report["scores"]) == {
              "readme", "activity", "freshness", "docs", "ci",
              "issues", "community", "pr_velocity", "security",
          }

          print(f"Release preflight passed: {score}/100; action version {action_version}")

      - name: Update floating v2 tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch --tags --force origin
          git checkout --detach "$RELEASE_TAG"

          git tag -fa v2 -m "Floating tag v2 -> $RELEASE_TAG"
          git push origin v2 --force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "DevLens ${{ github.ref_name }}"
          body: |
            ## DevLens ${{ github.ref_name }}

            ### What's included
            - Repository health scoring across 9 dimensions
            - Automatic README score block updates
            - GitHub Actions job summary and machine-readable outputs
            - Live GitHub API integration testing
            - Zero hosted service dependency

            ### Usage
            ```yaml
            - uses: SamoTech/devlens@v2
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
