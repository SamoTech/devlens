name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'
      floating_tag:
        description: 'Floating major tag (e.g. v2)'
        required: true
        default: 'v2'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Pre-release static validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/devlens.py
          test -f action.yml
          test -f requirements.txt
          grep -Fx 'requests==2.34.2' requirements.txt
          grep -Fx 'PyGithub==2.10.0' requirements.txt

      - name: Pre-release live Action validation
        id: preflight
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          update_readme: 'false'

      - name: Validate live release candidate
        env:
          SCORE: ${{ steps.preflight.outputs.health_score }}
          REPORT: ${{ steps.preflight.outputs.report_json }}
        shell: python
        run: |
          import json, os
          score = int(os.environ["SCORE"])
          assert 0 <= score <= 100
          report = json.loads(os.environ["REPORT"])
          assert report["score_model"] == "action-v2-9d"
          assert report["action_version"] == "2.0.0"
          assert set(report["scores"]) == {
              "readme", "activity", "freshness", "docs", "ci",
              "issues", "community", "pr_velocity", "security",
          }
          print(f"Release preflight passed: {score}/100")

      - name: Refuse to overwrite versioned release tag
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/${{ github.event.inputs.tag }}" >/dev/null; then
            echo "Release tag already exists: ${{ github.event.inputs.tag }}"
            exit 1
          fi

      - name: Create and push tags
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          case "${{ github.event.inputs.tag }}" in
            v2.*) ;;
            *) echo "Release tag must be v2.x.x for the current product line"; exit 1 ;;
          esac
          if [ "${{ github.event.inputs.floating_tag }}" != "v2" ]; then
            echo "Floating tag must be v2 for the current product line"
            exit 1
          fi

          # Create versioned tag
          git tag -a "${{ github.event.inputs.tag }}" \
            -m "Release ${{ github.event.inputs.tag }}"
          git push origin "${{ github.event.inputs.tag }}"

          # Create / force-update floating major tag
          git tag -fa "${{ github.event.inputs.floating_tag }}" \
            -m "Floating tag ${{ github.event.inputs.floating_tag }} -> ${{ github.event.inputs.tag }}"
          git push origin "${{ github.event.inputs.floating_tag }}" --force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2.2.2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: "DevLens ${{ github.event.inputs.tag }}"
          body: |
            ## 🚀 DevLens ${{ github.event.inputs.tag }}

            ### What's included
            - Repository health scoring across 9 dimensions
            - Automatic README score block updates
            - GitHub Actions job summary and machine-readable outputs
            - Live GitHub API integration testing
            - Zero hosted service dependency

            ### Usage
            ```yaml
            - uses: SamoTech/devlens@v2
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
