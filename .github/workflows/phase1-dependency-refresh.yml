name: Phase 1 Dependency Refresh

on:
  push:
    branches:
      - phase-1-architecture-consistency

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Refresh Next.js security baseline
        run: npm install --save-exact next@16.3.6 eslint-config-next@16.3.6
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit refreshed dependency lockfile
        working-directory: .
        run: |
          if git diff --quiet -- dashboard/package.json dashboard/package-lock.json; then
            echo "Dependency tree already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/package.json dashboard/package-lock.json
          git commit -m "fix: refresh Next.js security baseline"
          git push
