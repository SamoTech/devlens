name: 'DevLens Repo Health'
description: 'Score your repository across 9 health dimensions, publish a transparent report, and optionally update your README.'
author: 'SamoTech'
branding:
  icon: 'activity'
  color: 'green'
inputs:
  github_token:
    description: 'GitHub token'
    required: true
  notify_discord:
    description: 'Discord webhook for the health report'
    required: false
    default: ''
  fail_on_score_below:
    description: 'Fail the Action when the overall score is below this 0-100 threshold'
    required: false
    default: ''
outputs:
  health_score:
    description: 'Repo health score 0-100 using action-v2-9d'
  badge_url:
    description: 'shields.io badge URL'
  report_json:
    description: 'Full 9-dimension JSON report'
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      shell: bash
      run: pip install requests PyGithub python-dateutil --quiet
    - name: Run DevLens Action v2
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        BADGE_STYLE: ${{ inputs.badge_style }}
        UPDATE_README: ${{ inputs.update_readme }}
        DISCORD_WEBHOOK: ${{ inputs.notify_discord }}
        FAIL_ON_SCORE_BELOW: ${{ inputs.fail_on_score_below }}
        REPO: ${{ github.repository }}
      run: python ${{ github.action_path }}/scripts/devlens.py
