name: 'DevLens Repo Health'
description: 'Score your repository across 9 health dimensions and optionally maintain a transparent README health report.'
author: 'SamoTech'
branding:
  icon: 'activity'
  color: 'green'
inputs:
  github_token:
    description: 'GitHub token'
    required: true
  badge_style:
    description: 'Shields.io badge style'
    required: false
    default: 'flat'
  update_readme:
    description: 'Update the README health block'
    required: false
    default: 'true'
  readme_branch:
    description: 'Branch to update when update_readme is true; empty uses the repository default branch'
    required: false
    default: ''
  notify_discord:
    description: 'Discord webhook for the health report'
    required: false
    default: ''
  fail_on_score_below:
    description: 'Fail the Action when the overall score is below this 0-100 threshold'
    required: false
    default: ''
outputs:
  health_score:
    description: 'Repo health score 0-100 using action-v2-9d'
    value: ${{ steps.devlens.outputs.health_score }}
  badge_url:
    description: 'shields.io badge URL'
    value: ${{ steps.devlens.outputs.badge_url }}
  report_json:
    description: 'Full 9-dimension JSON report'
    value: ${{ steps.devlens.outputs.report_json }}
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      shell: bash
      run: pip install requests PyGithub --quiet
    - name: Run DevLens Action v2
      id: devlens
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        BADGE_STYLE: ${{ inputs.badge_style }}
        UPDATE_README: ${{ inputs.update_readme }}
        README_BRANCH: ${{ inputs.readme_branch }}
        DISCORD_WEBHOOK: ${{ inputs.notify_discord }}
        FAIL_ON_SCORE_BELOW: ${{ inputs.fail_on_score_below }}
        REPO: ${{ github.repository }}
      run: python ${{ github.action_path }}/scripts/devlens.py
